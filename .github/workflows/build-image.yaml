name: Build Image
on:
  workflow_call:
    inputs:
      actor:
        required: true
        type: string
      repository:
        required: true
        type: string
jobs:
  build-service-image:
    name: Build Service Image
    runs-on: [ubuntu-latest]
    env:
      REGISTRY: ghcr.io/${{ inputs.repository }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # The image bundles a bun runtime and a python helper; both are installed
      # inside the Dockerfile. These two steps only type-check / syntax-check the
      # sources on the runner so a broken commit fails before the image is built.
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - name: Install Bun Dependencies
        run: bun install
      - name: Bundle Check TypeScript Sources
        run: bun build proxy.ts chatgpt-provider.ts --target bun --outdir /tmp/build-check
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Syntax Check Helper
        run: python3 -m py_compile chatgpt-http-helper.py

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ inputs.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Lowercase Repository Name
        run: |
          REPO_LOWER=$(echo "${{ inputs.repository }}" | tr '[:upper:]' '[:lower:]')
          echo "REGISTRY=ghcr.io/$REPO_LOWER" >> $GITHUB_ENV
      # main is the only branch, so there is only ever one tag to build.
      - name: Build and Push Image
        env:
          TAG: prod-latest
          # compose interpolates the whole file even when only building; the
          # credentials are not baked into the image, so placeholders are fine.
          CHATGPT_COOKIES: build
          CHATGPT_ACCESS_TOKEN: build
        run: |
          docker compose -f .docker/compose.yaml --profile prod build
          docker compose -f .docker/compose.yaml --profile prod push chatgpt-proxy-prod
